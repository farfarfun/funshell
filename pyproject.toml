[project]
name = "funshell"
version = "1.0.23"
description = "轻量级 Python shell 命令执行工具，支持实时流式输出或捕获输出为字符串、超时与工作目录控制、批量命令执行，并提供按端口/进程名查询与终止进程的 CLI 和 Python API。"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.7", "typer>=0.15.3",]
keywords = [ "shell", "subprocess", "command", "execute",]
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funshell = "funshell.cli:main"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funshell"
Releases = "https://github.com/farfarfun/funshell/releases"

[tool.setuptools]

[tool.setuptools.packages.find]
where = [ "src",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "pytest>=8.0", "ruff>=0.16",]

[tool.ruff.lint]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
